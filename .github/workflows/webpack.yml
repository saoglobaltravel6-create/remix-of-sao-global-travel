name: NodeJS with Vite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      # The repository lockfile currently contains placeholder integrity values.
      # Re-resolve it from package.json in the runner, then verify that the
      # generated lockfile is usable by npm ci. This avoids committing a hand-
      # written or fabricated lockfile.
      - name: Regenerate npm lockfile in CI
        run: npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund

      - name: Verify lockfile integrity
        run: |
          if grep -q 'sha512-xxx' package-lock.json; then
            echo "Invalid placeholder integrity value found in package-lock.json"
            exit 1
          fi
          npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
